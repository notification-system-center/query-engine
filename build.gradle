plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.4.0'
    id 'com.diffplug.spotless' version '6.23.0'
}

group = 'com.organization'
version = '0.0.1'
description = 'Query engine'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310")
    implementation 'io.micrometer:micrometer-registry-prometheus'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0")
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
    generatorName.set("spring")
    outputDir.set("$buildDir/generated")
    configFile.set("${projectDir}/src/main/resources/openapi/config/config.json")
    inputSpec.set("${projectDir}/src/main/resources/openapi/users_swagger.yaml")
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}

spotless {
    java {
        target 'src/**/*.java'         // Apply to all Java source files
        googleJavaFormat()             // Use Google Java Format
        removeUnusedImports()          // Optional: remove unused imports
    }
}
tasks.named('test') {
    useJUnitPlatform()
}
